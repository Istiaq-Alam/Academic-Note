<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - File Not Found</title>
    <style>
    :root {
      --bg-dark: #1e1e2e;
      --bg-card: #2a2a3d;
      --bg-section: #22223a;
      --accent: #ffd369;
      --blue: #4b8bff;
      --blue-dark: #3a74d8;
      --text-light: #eee;
      --text-muted: #aaa;
      --border: rgba(255, 255, 255, 0.07);
      --radius: 10px;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      line-height: 1.6;
    }

    .error-box {
      text-align: center;
      background: var(--bg-card);
      padding: 40px 60px;
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: var(--accent);
      font-size: 3em;
      margin: 0;
    }

    p {
      color: var(--text-muted);
      font-size: 1.2em;
      margin: 10px 0 20px;
    }

    button {
      background-color: var(--blue);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.18s, color 0.18s;
    }

    button:hover {
      background-color: var(--blue-dark);
    }
  </style>
  </head>
  <body>
    <div class="error-box">
      <h1>404 :")</h1>
      <p>File Not Found or Didn't uploaded</p>
      <button onclick="goHome()">🏠 Back to File Manager</button>
    </div>

    <script>
    function goHome() {
      window.location.href = "../index.html";
    }
  </script>
  </body>
</html>
